<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>仇人榜</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --bg: #000; --ink: #f00; --font: "Noto Serif SC", serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--bg); font-family: var(--font); }
    body::before { position: fixed; inset: 0; pointer-events: none; content: ""; opacity: .14; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E"); }
    header { position: relative; padding: 72px 24px 42px; text-align: center; border-bottom: 1px solid color-mix(in srgb, var(--ink) 35%, transparent); }
    .eyebrow { margin: 0 0 15px; font: 11px/1.5 "Noto Serif SC", serif; letter-spacing: .48em; opacity: .72; }
    h1 { margin: 0; font: 400 clamp(56px, 10vw, 104px)/1.1 "Ma Shan Zheng", var(--font); letter-spacing: .16em; text-shadow: 0 0 24px color-mix(in srgb, var(--ink) 32%, transparent); }
    .subtitle { margin: 18px 0 0; font-size: 13px; letter-spacing: .22em; opacity: .72; }
    main { position: relative; width: min(840px, calc(100% - 36px)); margin: 0 auto; padding: 48px 0 100px; }
    .empty { padding: 48px 20px; border: 1px solid color-mix(in srgb, var(--ink) 25%, transparent); text-align: center; letter-spacing: .15em; opacity: .66; }
    .tag-section { margin: 0 0 40px; }
    .tag-title { display: flex; align-items: center; gap: 14px; margin: 0 0 15px; font-size: 15px; font-weight: 600; letter-spacing: .28em; }
    .tag-title::after { height: 1px; flex: 1; content: ""; background: color-mix(in srgb, var(--ink) 28%, transparent); }
    .entry { display: grid; grid-template-columns: 46px 1fr; gap: 14px; padding: 18px 0 20px; border-bottom: 1px solid color-mix(in srgb, var(--ink) 17%, transparent); }
    .number { padding-top: 2px; font: 13px/1.6 "Noto Serif SC", serif; opacity: .5; }
    .entry h3 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .1em; }
    .entry p { margin: 9px 0 0; color: color-mix(in srgb, var(--ink) 78%, white); font-size: 14px; line-height: 1.9; white-space: pre-wrap; overflow-wrap: anywhere; }
    .entry .story { margin-top: 12px; color: color-mix(in srgb, var(--ink) 78%, white); font-size: 13px; }
    .story summary { width: fit-content; color: var(--ink); cursor: pointer; letter-spacing: .08em; }
    .story summary::marker { color: color-mix(in srgb, var(--ink) 70%, white); }
    .story p { margin-top: 10px; padding-left: 12px; border-left: 1px solid color-mix(in srgb, var(--ink) 40%, transparent); }
    footer { position: relative; padding: 24px; text-align: center; font-size: 11px; letter-spacing: .2em; opacity: .4; }
    @media (max-width: 520px) { header { padding-top: 56px; } main { padding-top: 34px; } .entry h3 { font-size: 18px; } }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">私刑の記録 · PERSONAL RECORD</p>
    <h1>仇人榜</h1>
    <p class="subtitle">君子报仇，十年不晚</p>
  </header>
  <main id="list" aria-live="polite"><div class="empty">正在读取记录…</div></main>
  <footer>THE LIST IS NEVER COMPLETE</footer>
  <script>
    const fontStacks = {
      gothic: '"Noto Serif SC", serif',
      handwritten: '"Ma Shan Zheng", "Noto Serif SC", serif',
      serif: 'Georgia, "Noto Serif SC", serif',
    };
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    })[char]);
    async function render() {
      const list = document.querySelector("#list");
      try {
        const response = await fetch("/api/public");
        if (!response.ok) throw new Error("读取失败");
        const { settings, tags, entries } = await response.json();
        document.documentElement.style.setProperty("--bg", settings.backgroundColor);
        document.documentElement.style.setProperty("--ink", settings.textColor);
        document.documentElement.style.setProperty("--font", fontStacks[settings.fontStyle] || fontStacks.gothic);
        if (!entries.length) {
          list.innerHTML = '<div class="empty">暂无记录</div>';
          return;
        }
        const entriesByTag = new Map();
        for (const entry of entries) {
          if (!entriesByTag.has(entry.tagId)) entriesByTag.set(entry.tagId, []);
          entriesByTag.get(entry.tagId).push(entry);
        }
        const sections = tags
          .map((tag) => ({ title: tag.name, entries: entriesByTag.get(tag.id) || [] }))
          .filter((section) => section.entries.length > 0);
        const untagged = entriesByTag.get(null) || [];
        if (untagged.length) sections.push({ title: "未分类", entries: untagged });
        let number = 0;
        list.innerHTML = sections.map((section) => `
          <section class="tag-section">
            <h2 class="tag-title">${escapeHtml(section.title)}</h2>
            ${section.entries.map((entry) => `
              <article class="entry">
                <span class="number">${String(++number).padStart(2, "0")}</span>
                <div>
                  <h3>${escapeHtml(entry.name)}</h3>
                  ${entry.description ? `<p>${escapeHtml(entry.description)}</p>` : ""}
                  ${entry.story ? `<details class="story"><summary>仇人故事</summary><p>${escapeHtml(entry.story)}</p></details>` : ""}
                </div>
              </article>`).join("")}
          </section>`).join("");
      } catch {
        list.innerHTML = '<div class="empty">记录暂时无法读取，请稍后重试</div>';
      }
    }
    render();
  </script>
</body>
</html>
